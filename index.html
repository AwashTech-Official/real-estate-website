    <script>
      (function() {
        // Global error capturing for diagnostics
        window.__APPLET_LAST_ERROR__ = '';
        window.__APPLET_RENDERED__ = false;

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) ? event.message : String(event);
          if (event && event.filename) {
            msg += ' (' + event.filename + ':' + (event.lineno || 0) + ')';
          }
          window.__APPLET_LAST_ERROR__ = msg;
          console.error('[Global Error Listener]', msg);
        });

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : 'Unhandled Promise rejection';
          window.__APPLET_LAST_ERROR__ = msg;
          console.error('[Global Unhandled Rejection]', msg);
        });

        // 8-Second Watchdog Timer: Protect against silent blank screens
        window.__APPLET_WATCHDOG__ = setTimeout(function() {
          var root = document.getElementById('root');
          var isRendered = window.__APPLET_RENDERED__ || (root && root.children && root.children.length > 0 && root.offsetHeight > 50);
          if (!isRendered) {
            var fallbackDiv = document.getElementById('emergency-fallback');
            if (fallbackDiv) {
              fallbackDiv.style.display = 'flex';
            }
            var errEl = document.getElementById('emergency-error-text');
            if (errEl) {
              errEl.textContent = window.__APPLET_LAST_ERROR__ || 'Initialization took longer than 8 seconds on this device/connection.';
            }
          }
        }, 8000);
      })();
    </script>
